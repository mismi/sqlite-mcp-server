name: CI

# Any branch: this repository has no main branch or remote yet, so a branch filter would
# skip the very first push. workflow_dispatch keeps a manual run possible in any case.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.runtime }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [node-22.16, node-22.18, node-24, bun]
        include:
          # Node 22.16 needs the flag; 22.18+ strips types by default.
          - runtime: node-22.16
            node: "22.16"
            command: node --experimental-strip-types
          - runtime: node-22.18
            node: "22.18"
            command: node
          - runtime: node-24
            node: "24"
            command: node
          # Bun runs the scripts itself; Node is still installed because the build
          # shell shims for tsc expect it.
          - runtime: bun
            node: "22.18"
            command: bun

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (type-check src/ and scripts/, then emit dist/)
        run: bun run build

      - name: Type-check without emitting
        run: bun run typecheck

      # Exactly one test run per job, and never two: the coverage run is the same suite plus
      # instrumentation, so it replaces the plain run in the one job that measures.
      - name: Unit tests (bun:test)
        if: runner.os != 'Linux' || matrix.runtime != 'bun'
        run: bun run test

      # Coverage runs once, on Linux + Bun: the numbers do not depend on the runtime or the
      # OS, so measuring in all eight jobs only doubles the matrix time.
      - name: Unit tests with coverage (lcov)
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        run: bun test --coverage --coverage-reporter=lcov

      - name: Check per-file coverage floors
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        run: bun scripts/check-coverage.ts

      # The scripts spawn the built server with process.execPath, so this exercises the
      # server under the matrix runtime too: stdio, then Streamable HTTP on /mcp with the
      # Host/Origin refusals and the loopback Origin controls.
      - name: Smoke
        run: ${{ matrix.command }} scripts/smoke.ts

      - name: Deterministic evaluations
        run: ${{ matrix.command }} scripts/evals.ts

      # End-to-end coverage: the scripts spawn the built server and Bun does not instrument child
      # processes, so they are replayed under Node with NODE_V8_COVERAGE (a few seconds) and the
      # dumps are merged by c8. The HTTP child now receives the variable and exits on SIGTERM, so
      # Linux counts the whole entry point. The report stays informational (no floor): Windows
      # terminates children unconditionally, so the number is not yet a portable gate.
      - name: End-to-end coverage (informational, no threshold)
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        run: |
          rm -rf .v8cov coverage-e2e
          NODE_V8_COVERAGE="$PWD/.v8cov" node scripts/smoke.ts
          NODE_V8_COVERAGE="$PWD/.v8cov" node scripts/evals.ts
          bunx c8@10.1.3 report --temp-directory=.v8cov --reporter=text --reporter=lcov --report-dir=coverage-e2e
          cp coverage-e2e/lcov.info coverage/e2e-lcov.info

      # One artifact, side by side: coverage/lcov.info (unit, Bun) and coverage/e2e-lcov.info.
      - name: Upload coverage reports
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

name: CI

# Any branch, plus pull requests, so a fork or a side branch is verified too; workflow_dispatch
# keeps a manual run possible without pushing.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs alongside the matrix as a fast gate: expression, action and shell mistakes are reported
  # in seconds instead of as eight failures. The script and the version are pinned so the check
  # is the same binary that was run locally.
  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check workflow syntax
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  verify:
    name: ${{ matrix.runtime }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime: [node-22.16, node-22.18, node-24, bun]
        include:
          # Node 22.16 needs the flag; 22.18+ strips types by default.
          - runtime: node-22.16
            node: "22.16"
            command: node --experimental-strip-types
          - runtime: node-22.18
            node: "22.18"
            command: node
          - runtime: node-24
            node: "24"
            command: node
          # Bun runs the scripts itself; Node is still installed because the build
          # shell shims for tsc expect it.
          - runtime: bun
            node: "22.18"
            command: bun

    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build (type-check src/ and scripts/, then emit dist/)
        run: bun run build

      - name: Type-check without emitting
        run: bun run typecheck

      # Exactly one test run per job, and never two: the coverage run is the same suite plus
      # instrumentation, so it replaces the plain run in the one job that measures.
      - name: Unit tests (bun:test)
        if: runner.os != 'Linux' || matrix.runtime != 'bun'
        run: bun run test

      # Coverage runs once, on Linux + Bun: the numbers do not depend on the runtime or the
      # OS, so measuring in all eight jobs only doubles the matrix time.
      - name: Unit tests with coverage (lcov)
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        run: bun test --coverage --coverage-reporter=lcov

      - name: Check per-file coverage floors
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        run: bun scripts/check-coverage.ts

      # The scripts spawn the built server with process.execPath, so this exercises the
      # server under the matrix runtime too: stdio, then Streamable HTTP on /mcp with the
      # Host/Origin refusals and the loopback Origin controls. On Linux + node-24 the same two
      # scripts run instrumented instead of plain, below, so no job executes them twice.
      - name: Smoke
        if: runner.os != 'Linux' || matrix.runtime != 'node-24'
        run: ${{ matrix.command }} scripts/smoke.ts

      - name: Deterministic evaluations
        if: runner.os != 'Linux' || matrix.runtime != 'node-24'
        run: ${{ matrix.command }} scripts/evals.ts

      # The smoke and eval scripts spawn the built server, and Bun does not instrument child
      # processes. Here they run under Node with NODE_V8_COVERAGE in place of the plain run, so
      # the dumps cover the entry point without a second execution. Informational (no floor):
      # Linux counts the whole of src/index.ts, but Windows kills children unconditionally.
      - name: Smoke with V8 coverage (Linux + node-24)
        if: runner.os == 'Linux' && matrix.runtime == 'node-24'
        run: node scripts/smoke.ts
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/.v8cov

      - name: Deterministic evaluations with V8 coverage (Linux + node-24)
        if: runner.os == 'Linux' && matrix.runtime == 'node-24'
        run: node scripts/evals.ts
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/.v8cov

      # c8 is a devDependency, so the lockfile pins the version used here.
      - name: End-to-end coverage report
        if: runner.os == 'Linux' && matrix.runtime == 'node-24'
        run: ./node_modules/.bin/c8 report --temp-directory=.v8cov --reporter=text --reporter=lcov --report-dir=coverage-e2e

      # Windows kills the HTTP child unconditionally, so only the Linux run can gate on it.
      - name: Check end-to-end coverage floor (src/index.ts)
        if: runner.os == 'Linux' && matrix.runtime == 'node-24'
        run: bun scripts/check-e2e-coverage.ts

      # Two sibling artifacts: coverage-unit (Bun, lcov) and coverage-e2e (Node, lcov).
      - name: Upload end-to-end coverage
        if: runner.os == 'Linux' && matrix.runtime == 'node-24'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-e2e
          path: coverage-e2e/
          if-no-files-found: error

      - name: Upload unit coverage
        if: runner.os == 'Linux' && matrix.runtime == 'bun'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: error
